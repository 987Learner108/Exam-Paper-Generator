services:
  # Backend API Service
  - type: web
    name: exam-paper-generator-backend
    env: python
    buildCommand: "pip install --no-build-isolation --no-deps --only-binary=all --force-reinstall --no-cache-dir --no-warn-script-location --prefer-binary -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/health"
    autoDeploy: false
    plan: free
    regions: ["oregon"]
    disk:
      name: exam-paper-generator-data
      mountPath: /opt/render/project/src
      sizeGB: 1

  # Frontend Service
  - type: web
    name: exam-paper-generator-frontend
    env: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    healthCheckPath: /
    autoDeploy: false
    plan: free
    regions: ["oregon"]
    runtime: node-18
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /api/(.*)
        destination: https://exam-paper-generator-backend.onrender.com/api/$1

# Environment Variables (add these in Render dashboard)
# BACKEND_URL=https://exam-paper-generator-backend.onrender.com
# FRONTEND_URL=https://exam-paper-generator-frontend.onrender.com
# MONGODB_URL=your_mongodb_connection_string
# GEMINI_API_KEY=your_gemini_api_key
# JWT_SECRET_KEY=your_jwt_secret
# CLOUDINARY_CLOUD_NAME=your_cloudinary_name
# CLOUDINARY_API_KEY=your_cloudinary_key
# CLOUDINARY_API_SECRET=your_cloudinary_secret
# EMAIL_HOST_USER=your_email@gmail.com
# EMAIL_HOST_PASSWORD=your_app_password
# FRONTEND_ALLOWED_ORIGINS=https://exam-paper-generator-frontend.onrender.com,https://exam-paper-generator-backend.onrender.com
# PYTHON_VERSION=3.11
